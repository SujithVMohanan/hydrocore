<section class="card">
    <div class="card__header">
        <h2 class="card__title">Detected Rainfall Events</h2>
        <button id="exportBtn" class="link-btn" type="button">
            <span class="material-symbols-outlined" style="font-size:18px;">download</span>
            Export CSV
        </button>
    </div>

    <div class="table-wrap">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Start Date</th>
                    <th>End Date</th>
                    <th>Duration</th>
                    <th>Peak (mm/h)</th>
                    <th>Total (mm)</th>
                    <th style="text-align:right;">Status</th>
                </tr>
            </thead>
            <tbody id="eventTableBody">
                <tr>
                    <td colspan="6" class="data-table__empty">
                        <span class="material-symbols-outlined" style="font-size:40px;opacity:0.2;display:block;margin-bottom:8px;">water_drop</span>
                        Select a basin and run analysis to view events.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="table-footer">
        <span class="table-footer__info" id="paginationInfo">Showing 0 events</span>
        <nav class="pagination" id="paginationNav">
            <button id="prev-page" class="page-btn" disabled type="button">
                <span class="material-symbols-outlined">chevron_left</span>
            </button>
            <div id="pageNumbers" style="display:flex;gap:4px;"></div>
            <button id="next-page" class="page-btn" disabled type="button">
                <span class="material-symbols-outlined">chevron_right</span>
            </button>
        </nav>
    </div>
</section>
