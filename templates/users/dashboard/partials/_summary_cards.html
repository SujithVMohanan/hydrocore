<section class="stats-grid">
    <div class="card stat-card">
        <div class="stat-card__icon stat-card__icon--primary">
            <span class="material-symbols-outlined" style="font-size:28px;">water_drop</span>
        </div>
        <div>
            <div class="stat-card__label">Total Rainfall Events</div>
            <div class="stat-card__value" id="summary-total-events">—</div>
        </div>
    </div>

    <div class="card stat-card stat-card--tertiary">
        <div class="stat-card__icon stat-card__icon--tertiary">
            <span class="material-symbols-outlined" style="font-size:28px;">schedule</span>
        </div>
        <div>
            <div class="stat-card__label">Mean Event Duration</div>
            <div>
                <span class="stat-card__value" id="summary-mean-duration">—</span>
                <span class="stat-card__unit" id="dur-unit"></span>
            </div>
        </div>
    </div>

    <div class="card stat-card stat-card--error">
        <div class="stat-card__icon stat-card__icon--error">
            <span class="material-symbols-outlined" style="font-size:28px;">trending_up</span>
        </div>
        <div>
            <div class="stat-card__label">Highest Peak Rainfall</div>
            <div>
                <span class="stat-card__value" id="summary-highest-peak">—</span>
                <span class="stat-card__unit" id="peak-unit"></span>
            </div>
        </div>
    </div>
</section>
