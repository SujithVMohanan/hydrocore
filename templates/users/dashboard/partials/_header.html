<header class="dashboard-header">
    <div class="container dashboard-header__inner">
        <div class="dashboard-header__brand">
            <div class="dashboard-header__logo">
                <span class="material-symbols-outlined filled">water_drop</span>
            </div>
            <div>
                <div class="dashboard-header__title">HydroCore</div>
                <div class="dashboard-header__subtitle">Rainfall Event Detection &amp; Analysis</div>
            </div>
        </div>
        <div class="dashboard-header__actions">
            <div id="globalSpinner" class="hidden">
                <span class="material-symbols-outlined spinner-icon" style="color:var(--color-primary);font-size:22px;">progress_activity</span>
            </div>
            <button id="themeToggle" class="icon-btn" title="Toggle theme" type="button">
                <span class="material-symbols-outlined" id="themeIcon">dark_mode</span>
            </button>
        </div>
    </div>
</header>
