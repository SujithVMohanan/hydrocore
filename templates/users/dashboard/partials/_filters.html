<section class="card card--controls">
    <div class="card__header">
        <div class="card__header-left">
            <div class="card__header-icon">
                <span class="material-symbols-outlined">tune</span>
            </div>
            <div>
                <h2 class="card__title">Analysis Controls</h2>
                <p class="card__subtitle">Filter basin observations &amp; detect rainfall events</p>
            </div>
        </div>
        <button type="button" id="resetFiltersBtn" class="link-btn hidden">
            <span class="material-symbols-outlined" style="font-size:16px;">restart_alt</span>
            Reset Filters
        </button>
    </div>

    <div class="card__body card__body--overflow-visible">
        {{ basins|json_script:"basins-data" }}

        <form id="dashboard-form">
            <div class="form-grid">
                <div class="form-group form-group--basin">
                    <label class="form-label">
                        <span class="material-symbols-outlined" style="font-size:15px;">location_on</span>
                        Basin
                    </label>
                    <div class="basin-dropdown" id="basinDropdown">
                        <button type="button" class="basin-dropdown__trigger" id="basinDropdownTrigger" aria-haspopup="listbox" aria-expanded="false">
                            <span class="basin-dropdown__trigger-icon">
                                <span class="material-symbols-outlined">water_drop</span>
                            </span>
                            <span class="basin-dropdown__trigger-text">
                                <span class="basin-dropdown__trigger-label is-placeholder" id="basinDropdownLabel">Select a catchment basin</span>
                                <span class="basin-dropdown__trigger-id hidden" id="basinDropdownId"></span>
                            </span>
                            <span class="material-symbols-outlined basin-dropdown__chevron">expand_more</span>
                        </button>
                        <input type="hidden" id="basin-select" name="basin_id" required/>
                    </div>
                </div>

                <div class="form-group">
                    <label for="start_date" class="form-label">
                        <span class="material-symbols-outlined" style="font-size:15px;">event_upcoming</span>
                        Start Date
                    </label>
                    <div class="form-control-wrap">
                        <span class="field-icon material-symbols-outlined">calendar_today</span>
                        <input id="start_date" type="text" placeholder="Select start date" class="form-control form-control--icon-left" readonly/>
                    </div>
                </div>

                <div class="form-group">
                    <label for="end_date" class="form-label">
                        <span class="material-symbols-outlined" style="font-size:15px;">event_available</span>
                        End Date
                    </label>
                    <div class="form-control-wrap">
                        <span class="field-icon material-symbols-outlined">calendar_month</span>
                        <input id="end_date" type="text" placeholder="Select end date" class="form-control form-control--icon-left" readonly/>
                    </div>
                </div>

                <div class="form-group">
                    <label for="min_dry_gap_hours" class="form-label">
                        <span class="material-symbols-outlined" style="font-size:15px;">av_timer</span>
                        Min Dry Gap (hrs)
                    </label>
                    <div class="form-control-wrap">
                        <span class="field-icon material-symbols-outlined">timer</span>
                        <input id="min_dry_gap_hours" type="number" value="6" min="1" max="72" class="form-control form-control--icon-left"/>
                    </div>
                </div>

                <div class="form-group">
                    <button type="submit" id="executeBtn" class="btn btn--primary btn--block">
                        <span class="material-symbols-outlined" id="btnIcon">analytics</span>
                        <span id="btnLabel">Analyse</span>
                    </button>
                </div>
            </div>

            <div class="range-pills">
                <span class="range-pills__label">Quick range:</span>
                <button type="button" class="pill" data-range="7">Last 7 days</button>
                <button type="button" class="pill" data-range="30">Last 30 days</button>
                <button type="button" class="pill" data-range="90">Last 90 days</button>
                <button type="button" class="pill" data-range="all">All time</button>
            </div>

            <div id="activeFilters" class="filter-chips hidden"></div>
        </form>
    </div>
</section>

<!-- Basin dropdown panel (fixed to body — avoids overflow clipping) -->
<div id="basinDropdownPanel" class="basin-dropdown__panel" role="listbox" hidden>
    <div class="basin-dropdown__search-wrap">
        <span class="material-symbols-outlined">search</span>
        <input type="text" id="basinSearch" placeholder="Search by name or ID…" autocomplete="off"/>
    </div>
    <div class="basin-dropdown__list" id="basinDropdownList"></div>
</div>
